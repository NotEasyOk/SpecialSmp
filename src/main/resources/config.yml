# ======================================================
#          SPECIAL SMP - OFFICIAL CONFIGURATION
# ======================================================
              Author: NotEasyOk

  prefix: "&8[&6&lSpecialSMP&8] &r"
  first-join-give-card: true
  
  # --- SOUL FUEL SYSTEM SETTINGS ---
  # Initial fuel for new players (86399 = 23h 59m 59s)
  default-soul-fuel: 86399
  # Ban reason and kick notification
  soul-fuel-ban-reason: "Terminated: Soul Fuel Exhausted"
  soul-fuel-kick-message: "&c&lSOUL DEPLETED! \n\n&7Your existence has reached its limit."

  # --- ACTION BAR DISPLAY SETTINGS ---
  # Display Soul Fuel when no card is equipped
  show-fuel-by-default: true
  # Action Bar formatting
  soul-fuel-display-format: "&b&lSOUL FUEL: &f%time%"

cooldowns:
  "Enderman Card":
    left: 60
    right: 40
    shift_right: 90
  "Herobrine Card":
    left: 10
    right: 60
    shift_right: 180
  "Zombie Card":
    left: 60
    right: 60
    shift_right: 120
  "Creeper Card":
    left: 60
    right: 90
    shift_right: 120
  "Lighting Card":
    left: 40
    right: 20
    shift_right: 60
  "Warden Card":
    left: 60
    right: 120
    shift_right: 180
  "Ghost Card":
    left: 60
    right: 40
    shift_right: 90
  "Ruin Card":
    left: 30
    right: 45
    shift_right: 60
  "Nothing Card":
    left: 20
    right: 40
    shift_right: 60
  "Ultimate Card":
    left: 120
    right: 120
    shift_right: 300

# Advanced configuration for specific cards
settings-extra:
  zombie:
    max-zombies: 2
    duration: 60

settings:
  soul-fuel:
    enabled: true
    enable-ban: true
  display:
    fuel-format: "&b&lSOUL FUEL: &f%time%"

messages:
  no-permission: "&cInsufficient permissions to execute this action!"
  cooldown-active: "&cCooldown active. Please wait &e%time%s&c."
  card-received: "&aSuccessfully received: &6%card%&a."

allowed-first-join-cards:
  - "Enderman Card"
  - "Herobrine Card"
  - "Nothing Card"
  - "Zombie Card"
  - "Warden Card"
  - "Creeper Card"
  - "Lighting Card"
  - "Ghost Card"
  - "Ruin Card"
